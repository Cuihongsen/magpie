name: Fork package

# This fork's own packaging, on GitHub's runners alone: the macOS Apple
# Silicon installer, which is all this fork is for. A push to the
# customizations branch builds it (ad-hoc signed: no Apple certificate
# here) and keeps it as an artifact; a v* tag also makes a dmg and
# publishes both on this fork's Releases. No CLI or other platform is
# built: seven cross-compiles on a macOS runner took longer than the app
# itself, and none of them is used here. Upstream's release.yml hands off
# to yetone/magpie-releases with the upstream owner's token, so its jobs
# stand aside in a fork.

on:
  push:
    branches: [main, codex-local-customizations-v2697]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: fork-package-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  app:
    name: app (macOS arm64)
    # macos-latest is Apple Silicon on GitHub's hosted runners: the app is
    # built natively, as the Makefile's cgo and the CoreML guard require.
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe names a branch build after its tag

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(git describe --tags --always | sed 's/^v//')"
          fi
          VERSION="$(printf '%s' "$VERSION" | tr -cd 'A-Za-z0-9._+-')"
          [[ -n "$VERSION" ]] || VERSION="0.0.0-${GITHUB_SHA::8}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "building $VERSION from $GITHUB_SHA"

      - name: Build the macOS app
        run: make app VERSION="${{ steps.version.outputs.version }}"

      - name: Verify update tests
        if: startsWith(github.ref, 'refs/tags/')
        run: go test -tags nogui ./internal/update -count=1

      # no Developer ID here, and no notarisation: the app runs once the
      # quarantine flag is off (INSTALL.txt says how)
      - name: Sign it for this computer (ad hoc)
        shell: bash
        run: |
          set -euo pipefail
          codesign --force --deep --sign - magpie.app
          codesign --verify --deep --strict magpie.app

      - name: Zip the app
        shell: bash
        run: |
          set -euo pipefail
          V="${{ steps.version.outputs.version }}"
          mkdir -p out
          # magpie-darwin-arm64.zip is the name the updater installs
          # (update.AppAsset); the versioned copy is for people
          ditto -c -k --sequesterRsrc --keepParent magpie.app "out/magpie-darwin-arm64.zip"
          cp "out/magpie-darwin-arm64.zip" "out/magpie-${V}-macos-arm64.zip"
          cat > "out/INSTALL.txt" <<EOF
          magpie ${V} (fork build, macOS arm64 app)

          Unzip magpie-${V}-macos-arm64.zip and put magpie.app in /Applications.
          It is ad-hoc signed, not notarised: if macOS refuses it, run

            xattr -dr com.apple.quarantine /Applications/magpie.app
          EOF
          ls -lh out

      # a disk image takes hdiutil a while and the zip is what CI needs:
      # a tag gets one for people who prefer it
      - name: Make a dmg, for a tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          V="${{ steps.version.outputs.version }}"
          go clean -cache -testcache
          df -h "$RUNNER_TEMP"
          hdiutil create -volname "magpie ${V}" -srcfolder magpie.app -ov -format UDZO \
            "out/magpie-${V}-macos-arm64.dmg"
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: magpie-app-${{ steps.version.outputs.version }}
          path: out/*
          if-no-files-found: error
          compression-level: 0 # zip and dmg are compressed already
          retention-days: 30

      - name: Publish the tag's release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
          SIGNING_KEY: ${{ secrets.MAGPIE_FORK_UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          OPENSSL="$(brew --prefix openssl@3)/bin/openssl"
          test -x "$OPENSSL"
          test -n "$SIGNING_KEY"
          umask 077
          printf '%s\n' "$SIGNING_KEY" > "$RUNNER_TEMP/fork-update-key.pem"
          "$OPENSSL" pkey -in "$RUNNER_TEMP/fork-update-key.pem" -pubout -outform DER > "$RUNNER_TEMP/fork-update-public.der"
          actual="$(tail -c 32 "$RUNNER_TEMP/fork-update-public.der" | base64 | tr -d '\n')"
          test "$actual" = "NX0cFpZ4MIhp6Da2qNAAzE291u7b/DohybTo/QKWXEk="
          (cd out && shasum -a 256 * > SHA256SUMS.txt)
          printf 'magpie release %s\n' "$VERSION" > "$RUNNER_TEMP/fork-update-message"
          cat out/SHA256SUMS.txt >> "$RUNNER_TEMP/fork-update-message"
          "$OPENSSL" pkeyutl -sign -rawin -inkey "$RUNNER_TEMP/fork-update-key.pem" \
            -in "$RUNNER_TEMP/fork-update-message" -out "$RUNNER_TEMP/fork-update-signature"
          base64 < "$RUNNER_TEMP/fork-update-signature" | tr -d '\n' > out/SHA256SUMS.txt.sig
          "$OPENSSL" pkeyutl -verify -rawin -pubin -keyform DER -inkey "$RUNNER_TEMP/fork-update-public.der" \
            -in "$RUNNER_TEMP/fork-update-message" -sigfile "$RUNNER_TEMP/fork-update-signature"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            test "$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$TAG" --repo "$REPO" --title "$TAG" --generate-notes --draft
          fi
          gh release upload "$TAG" out/* --repo "$REPO" --clobber
          gh release edit "$TAG" --repo "$REPO" --draft=false --latest
